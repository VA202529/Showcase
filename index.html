  <style>
        :root { --vh: 1vh; }
        body { font-family: 'DM Sans', sans-serif; }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-anim { animation: fadeUp 0.5s ease-out both; }
        .card-anim:nth-child(1) { animation-delay: 0.05s; }
        .card-anim:nth-child(2) { animation-delay: 0.1s; }
        .card-anim:nth-child(3) { animation-delay: 0.15s; }
        .card-anim:nth-child(4) { animation-delay: 0.2s; }
        .card-anim:nth-child(5) { animation-delay: 0.25s; }
        .card-anim:nth-child(6) { animation-delay: 0.3s; }

        .project-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .project-card img {
            transition: transform 0.4s ease;
        }
        .project-card:hover img {
            transform: scale(1.06);
        }
        .filter-btn { transition: all 0.2s ease; }
        .filter-btn.active-filter {
            background: #c8a96e !important;
            color: #0a0a0a !important;
        }
    </style>

      </div>
      <p data-template-id="proj2-desc" class="canva-text text-sm opacity-50 mb-3"></p>

       <span class="px-2 py-0.5 rounded text-[10px] bg-white/5 text-white/40">Automotive</span> <span class="px-2 py-0.5 rounded text-[10px] bg-white/5 text-white/40">Web</span>

     </div></a>
   </div><!-- Empty state -->
   <p id="no-results" class="hidden text-white/30 text-center py-16 text-sm">Geen projecten gevonden.</p>

  <footer class="w-full border-t border-white/10 mt-12">
   <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-between">
    <p data-template-id="footer-text" class="canva-text text-xs opacity-30"></p>
    <div class="flex items-center gap-1 opacity-30">
     <i data-lucide="diamond" class="w-3 h-3 text-[#c8a96e]"></i> <span class="text-[10px] text-white/50 uppercase tracking-widest">Van Appiah</span>

   </div>

  <script src="/_sdk/editing_sdk.js"></script>
  <script>
        lucide.createIcons();

        let activeStatus = 'all';
        let activeTag = 'all';
        const searchInput = document.getElementById('search-input');
        const cards = document.querySelectorAll('#project-grid > *');
        const noResults = document.getElementById('no-results');

        function filterCards() {
            const query = searchInput.value.toLowerCase().trim();
            let visible = 0;
            cards.forEach(card => {
                const status = card.dataset.projectStatus;
                const tags = card.dataset.projectTags || '';
                const name = (card.dataset.projectName || '').toLowerCase();
                const desc = (card.dataset.projectDesc || '').toLowerCase();
                const matchStatus = activeStatus === 'all' || status === activeStatus;
                const matchTag = activeTag === 'all' || tags.split(',').includes(activeTag);
                const matchSearch = !query || name.includes(query) || desc.includes(query);
                const show = matchStatus && matchTag && matchSearch;
                card.style.display = show ? '' : 'none';
                if (show) visible++;
            });
            noResults.classList.toggle('hidden', visible > 0);
        }

        document.getElementById('status-filters').addEventListener('click', e => {
            const btn = e.target.closest('[data-status]');
            if (!btn) return;
            activeStatus = btn.dataset.status;
            document.querySelectorAll('#status-filters .filter-btn').forEach(b => b.classList.remove('active-filter'));
            btn.classList.add('active-filter');
            filterCards();
        });

        document.getElementById('tag-filters').addEventListener('click', e => {
            const btn = e.target.closest('[data-tag]');
            if (!btn) return;
            activeTag = btn.dataset.tag;
            document.querySelectorAll('#tag-filters .filter-btn').forEach(b => b.classList.remove('active-filter'));
            btn.classList.add('active-filter');
            filterCards();
        });

        searchInput.addEventListener('input', filterCards);
    </script>
